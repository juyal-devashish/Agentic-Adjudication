services:
  ui:
    build: .
    command: streamlit run ui/app.py --server.address=0.0.0.0 --server.port=8501
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    env_file:
      - path: .env
        required: false

  runner:
    build: .
    command: python -m adjud.runner
    volumes:
      - ./data:/app/data
    env_file:
      - path: .env
        required: false
    restart: unless-stopped

  # Optional local mailbox for e-mail notifications (plan P-29):
  #   docker compose --profile mail up      then set SMTP_HOST=mailpit, SMTP_PORT=1025 in .env
  # Web inbox on http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.21
    profiles: ["mail"]
    ports:
      - "8025:8025"
      - "1025:1025"
