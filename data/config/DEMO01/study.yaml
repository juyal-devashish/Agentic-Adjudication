# Study configuration (from the Flow 1 test kit, plus runner and UI settings).
study: DEMO01
sites:
  - "101"
  - "102"
  - "104"
inbox_poll_minutes: 5        # F1-01
runner_tick_seconds: 10
upload_limits:
  max_file_mb: 50
  max_dicom_study_mb: 500
  max_pdf_pages: 200
# Shown to the site on page 2 as "documents requested".
requested_documents:
  - discharge_summary
  - ecg_report
  - lab_results
ai:
  phi_detection: false       # AI-1, stretch step C. Off by default.
  model: "claude-opus-5-5"    # pinned; only used if AI-1 is switched on
# Synthetic data only (mvp-flow-1.md §7.8 step 3): verification also searches each output
# for the generator's seeded identifiers of the case's subject. Relative to the data dir.
seeded_identities: flow1-testkit/identities/identities_SYNTHETIC.json
