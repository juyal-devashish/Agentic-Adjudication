# Study configuration (from the Flow 1 test kit, plus runner and UI settings).
study: DEMO01
sites:
  - "101"
  - "102"
  - "104"
inbox_poll_minutes: 5        # F1-01
runner_tick_seconds: 10
upload_limits:
  max_file_mb: 50
  max_dicom_study_mb: 500
  max_pdf_pages: 200
organisation: Tech Observer    # shown in the app and signs the e-mails
site_names:                    # display names of the study's (fictional) sites
  "101": Larkfield General Hospital
  "102": Brennan Valley Medical Centre
  "104": Klinikum Auenstadt
# Shown to the site on page 2 as "documents requested".
requested_documents:
  - discharge_summary
  - ecg_report
  - lab_results
ai:                          # plan §2 and P-26 to P-28; adjud/ai/config.py
  mode: "off"                # off | replay | live (live also needs ANTHROPIC_API_KEY)
  modes:                     # a function's own mode, over `mode` (P-58)
    slack_agent: "off"       # the Agent in Slack; ADJUD_AGENT_MODE overrides it
  model: "claude-opus-5-5"   # pinned (P-26, revised: see the plan's decisions table)
  effort: medium
  max_tokens: 16000
  timeout_seconds: 120
  max_tool_turns: 8
  max_retries: 2             # schema-invalid answers re-asked, then continue without AI
  min_confidence: 0.8        # gates send anything below this to a person
  budget_usd: 100.0          # live calls stop when the usage ledger reaches this
  price_per_mtok:            # Claude Opus 5.5; check the pricing page at go-live (P-28).
    input: 4.0               # Cache reads are 0.05x on Opus 5.5; the ledger counts 0.1x,
    output: 20.0             # so recorded costs err slightly high
  functions:                 # each agent function on or off; `mode` is the master switch
    document_type: true      # AI-2: QC step, documents without a recognisable title
    event_match: false       # retired from QC by P-39 (qc_suggestion covers it)
    qc_suggestion: true      # P-39: AI Suggestion for the Quality Check, every case
    narrative: true          # AI-4: facts-only narrative, every statement cited
    phi_detection: false     # AI-1: unredacted page images, synthetic data only
    slack_agent: true        # P-58: the Agent in Slack (runs only when its mode is not off)
# Synthetic data only: verification also searches each output
# for the generator's seeded identifiers of the case's subject. Relative to the data dir.
seeded_identities: flow1-testkit/identities/identities_SYNTHETIC.json
# Demo only (P-58): one public Slack channel per character, named by role. Anyone in a
# channel takes that person's part (simulated, as Acting As). Notices for them go there
# instead of a DM, and the Agent there acts as them. Real use: each person's own Slack
# account and the Agent's Messages tab. Empty or absent: DMs only. adjudicator-1, -2 and
# -3 are slots 1, 2 and 3 of DEMO01-0001 when it is the first case assigned after a reset
# (Dr Okafor, adjudicator-1, also chairs the committee). The pharmacovigilance mailbox's
# channel only receives its notice of a related outcome (P-60).
slack_character_channels:
  dm.dana: data-manager
  site101.coord: site-user
  ss.anna: safety-specialist
  cec.sofia: cec-coordinator
  adj.okafor: adjudicator-1
  adj.lindqvist: adjudicator-2
  adj.reyes: adjudicator-3
  "mailbox:pharmacovigilance": pharmacovigilance
slack_phi_gate:              # P-58 (Q17): the check on everything the Slack Agent posts
  allow: [Discharged]        # ordinary words NER takes for a name ("Discharged home ...")
narrative:                   # plan step 17; checked by code in the narrative gate
  min_statements: 3
  # Wording a narrative must not contain (case-insensitive): opinion on cause or
  # relatedness, adjudication language, and anything that could reveal allocation.
  forbidden: [caused by, due to the study, related to the study, relatedness,
    attributable, causal, adjudicat, we conclude, in my opinion, probably, likely,
    placebo, active arm, treatment arm, allocation, randomised to, randomized to, unblind]
edc_pull:                    # "Pull data from EDC" demo stand-in (plan step 21)
  exclude_ae_id_prefixes: ["H-"]   # history kept in the mock EDC for earlier-event lookups
adjudication:                # Flows 3 and 4 (plan P-41 to P-53)
  form: mi_v1                # forms/<form>.yaml; fixed for the round
  quorum: 3                  # committee attendees needed before the Chair can sign
  related:                   # Flow 4 "related?" (Q-07, P-50): notify pharmacovigilance
    field: related_to_study_drug
    value: related
  pharmacovigilance:         # a mailbox, not a user of the app
    name: Pharmacovigilance team
    email: pharmacovigilance@techobserver.com
