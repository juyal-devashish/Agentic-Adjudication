# Study configuration (from the Flow 1 test kit, plus runner and UI settings).
study: DEMO01
sites:
  - "101"
  - "102"
  - "104"
inbox_poll_minutes: 5        # F1-01
runner_tick_seconds: 10
upload_limits:
  max_file_mb: 50
  max_dicom_study_mb: 500
  max_pdf_pages: 200
# Shown to the site on page 2 as "documents requested".
requested_documents:
  - discharge_summary
  - ecg_report
  - lab_results
ai:                          # plan §2 and P-26 to P-28; adjud/ai/config.py
  mode: "off"                # off | replay | live (live also needs ANTHROPIC_API_KEY)
  model: "claude-haiku-5-5"  # pinned small model (P-26)
  effort: medium
  max_tokens: 16000
  timeout_seconds: 120
  max_tool_turns: 8
  max_retries: 2             # schema-invalid answers re-asked, then continue without AI
  min_confidence: 0.8        # gates send anything below this to a person
  budget_usd: 5.0            # live calls stop when the usage ledger reaches this
  price_per_mtok:            # Claude Haiku 5.5, prompts up to 100K tokens; check the
    input: 0.10              # pricing page at go-live (P-28)
    output: 0.50
  functions:                 # each agent function on or off; `mode` is the master switch
    document_type: true      # AI-2: QC step, documents without a recognisable title
    event_match: true        # QC step: do the documents describe this AE?
    narrative: true          # AI-4: facts-only narrative, every statement cited
    phi_detection: false     # AI-1: unredacted page images, synthetic data only
# Synthetic data only: verification also searches each output
# for the generator's seeded identifiers of the case's subject. Relative to the data dir.
seeded_identities: flow1-testkit/identities/identities_SYNTHETIC.json
narrative:                   # plan step 17; checked by code in the narrative gate
  min_statements: 3
  # Wording a narrative must not contain (case-insensitive): opinion on cause or
  # relatedness, adjudication language, and anything that could reveal allocation.
  forbidden: [caused by, due to the study, related to the study, relatedness,
    attributable, causal, adjudicat, we conclude, in my opinion, probably, likely,
    placebo, active arm, treatment arm, allocation, randomised to, randomized to, unblind]
