# De-identification policy (from the Flow 1 test kit; mvp-flow-1.md §7.4, §7.9).
# Detector settings are added in step 4.
version: 1
date_policy: dob_only        # P-01: clinical dates are kept, dates of birth redacted
must_redact:
  - PATIENT_NAME
  - DOB
  - MRN
  - INSURANCE_NO
  - ADDRESS
  - PHONE
  - EMAIL
  - NEXT_OF_KIN
  - CASE_REFERENCE
should_redact:               # reported, not gated
  - STAFF_NAME
  - STAFF_CONTACT
  - FACILITY
allow_list:                  # never redacted; "*" is a wildcard
  - DEMO01-*
  - Zelvoran
  - Wolff-Parkinson-White
  - Holter
  - Parkinson
  - Hodgkin
  - Addison
  - NIHSS
  - TIMI
context_labels:
  - Name
  - Patient
  - DOB
  - Date of birth
  - born
  - MRN
  - Hospital no
  - NHS No
  - Address
  - Tel
  - geb.
  - Pat.-Nr.
  - Versichertennr.
