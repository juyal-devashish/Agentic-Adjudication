# De-identification policy (from the Flow 1 test kit).
# Detector settings are added in step 4.
version: 1
date_policy: dob_only        # P-01: clinical dates are kept, dates of birth redacted
must_redact:
  - PATIENT_NAME
  - DOB
  - MRN
  - INSURANCE_NO
  - ADDRESS
  - PHONE
  - EMAIL
  - NEXT_OF_KIN
  - CASE_REFERENCE
should_redact:               # reported, not gated
  - STAFF_NAME
  - STAFF_CONTACT
  - FACILITY
allow_list:                  # never redacted; "*" is a wildcard
  - DEMO01-*
  - Zelvoran
  - Wolff-Parkinson-White
  - Holter
  - Parkinson
  - Hodgkin
  - Addison
  - NIHSS
  - TIMI
# Job titles: a name after a label ends before one, so "Signed: Dr Amelia Hart,
# Consultant Cardiologist" keeps the title.
role_words: [Consultant, Registrar, Physician, Cardiologist, Neurologist, Radiologist,
             Surgeon, Nurse, Oberarzt, Oberärztin, Chefarzt, Chefärztin, Facharzt, Fachärztin,
             Assistenzarzt, Assistenzärztin]
context_labels:
  - Name
  - Patient
  - DOB
  - Date of birth
  - born
  - MRN
  - Hospital no
  - NHS No
  - Address
  - Tel
  - geb.
  - Pat.-Nr.
  - Versichertennr.

# ---------------------------------------------------------------------------------------
# Detector settings (ours, step 4). Keys above mirror the test kit and must not drift.

# Extra never-redact terms (the study code on its own, common clinical words).
extra_allow:
  - DEMO01
  - Troponin
  - Placebo
  - ECG
  - EKG
  - MRT

# Label -> what follows it. A value after one of these labels is redacted even in an
# unusual format. Matched case-insensitively at word boundaries; labels of 3 characters
# or fewer must be followed by ":" or "." or a column gap.
labels:
  PATIENT_NAME: [Patient name, Patient, Patientin, Name, Re, Pat]
  NEXT_OF_KIN: [Next of kin, NOK, his wife, her husband, wife, husband, Ehefrau, Ehemann]
  DOB: [Date of birth, D.O.B., DOB, Born, Geburtsdatum, geb.]
  MRN: [Hospital number, Hospital no, Patient ID, MRN, Pat.-Nr., Patientennummer, Fallnummer]
  INSURANCE_NO: [NHS number, NHS No, Versichertennr., Versicherungsnummer]
  ADDRESS: [Home address, Address, Anschrift, Adresse, Wohnort]
  PHONE: [Telephone, Telefon, Phone, Mobile, Mobil, Tel]
  EMAIL: [E-mail, Email]
  CASE_REFERENCE: [coroner reference, reference, Accession, Aktenzeichen, Az.]
  STAFF_NAME: [General practitioner, Reported by, Signed, To, Hausarzt]

# Custom regex recognisers, applied to all text.
patterns:
  - {category: EMAIL, regex: '[\w.+-]+@[\w-]+(?:\.[\w-]+)+'}
  - {category: PHONE, regex: '\b0\d{4}\s?\d{6}\b'}                   # UK 01632 960001, 07700 900101
  - {category: PHONE, regex: '\+\d{2}(?:[ -]?\d{2,4}){2,4}\b'}       # +49 221 5550006
  - {category: INSURANCE_NO, regex: '\b\d{3} \d{3} \d{4}\b'}         # NHS-style 999 711 7031
  - {category: MRN, regex: '\bHN-[A-Z]{2}\d{5}\b'}                   # hospital numbers HN-RW46238
  - {category: CASE_REFERENCE, regex: '\b20\d\d/\d{5}\b'}            # coroner ref 2026/00417
  - {category: CASE_REFERENCE, regex: '\bACC\d{2}-\d{5}\b'}          # accession ACC26-04417
  - {category: STAFF_NAME, regex: "\\bDr\\.?(?: med\\.)? [A-ZÄÖÜ][a-zäöüß'-]+(?: [A-ZÄÖÜ][a-zäöüß'-]+)?"}
  - {category: FACILITY, regex: "\\b(?:St\\.? )?(?:[A-Z][a-z'-]+ ){1,3}(?:General Hospital|Hospital|Heart Centre|Health Centre|Medical Practice|Medical Centre|Infirmary|Surgery)\\b"}
  - {category: FACILITY, regex: '\b(?:Klinikum|Krankenhaus|Praxis) [A-ZÄÖÜ][\wäöüß-]+'}

# Short segments (between column gaps, "·" or "|") that contain a postcode are treated as
# an address line (letterheads, footers).
address_segment:
  max_words: 8
  postcode_regex: '\b(?:[A-Z]{1,2}\d[A-Z\d]? ?\d[A-Z]{2}|\d{5} [A-ZÄÖÜ][\wäöüß-]+)\b'

# Named-entity recognition (Presidio + spaCy en_core_web_lg). English pages only: on
# German text the English model flags whole clinical phrases.
ner:
  entities: [PERSON, LOCATION]
  min_score: 0.5
  languages: [en]

# A date after a date-of-birth label is only taken as a DOB if the person would be at least
# this old. Stops a clinical date that OCR places next to "geb." in a redacted output from
# being reported as a date of birth (adult study).
dob_min_age_years: 1
