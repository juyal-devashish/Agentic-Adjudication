[project]
name = "adjud"
version = "0.1.0"
description = "Clinical event adjudication: Flow 1 (intake) proof of concept. Synthetic data only."
requires-python = ">=3.12,<3.13"
dependencies = [
    "bcrypt>=5.0.0",
    "en-core-web-lg",
    "faker>=40.44.0",
    "filelock>=4.2.9",
    "jsonschema>=4.26.0",
    "openpyxl>=3.1.5",
    "pillow>=13.0.0",
    "presidio-analyzer>=2.2.366",
    "pydantic>=2.14.3",
    "pydicom>=3.0.2",
    "pymupdf>=2.1",
    "pytesseract>=0.3.13",
    "pyyaml>=6.0.3",
    "reportlab>=5.1.0",
    "spacy>=3.8.18",
    "streamlit>=1.67.0",
]

[dependency-groups]
dev = [
    "numpy>=2.4.6",
    "pypdf>=7.0.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["adjud"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
"tools/make_synthetic.py" = ["S311"]  # seeded random for synthetic data, not crypto

[tool.uv.sources]
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl" }
